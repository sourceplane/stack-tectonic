name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish-package:
    name: Publish package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Orun
        uses: sourceplane/orun-action@v1.1.0

      - name: Make helper scripts executable
        run: chmod +x scripts/*.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive release version
        shell: bash
        run: |
          stack_version="$(awk '/^  version: /{print $2}' stack.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          test -n "${stack_version}"
          test "${stack_version}" = "${tag_version}"
          echo "STACK_VERSION=${stack_version}" >> "${GITHUB_ENV}"

      - name: Verify catalog
        run: ./scripts/verify.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists."
            exit 0
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      # Runs after the release so the tag and release notes are the record of
      # record before the immutable artifact is pushed. The target is passed
      # explicitly: with no ref, orun infers ghcr.io/<owner>/<repo>/<package>
      # from the git remote, which is the wrong repository path.
      - name: Publish OCI package
        run: |
          orun publish "ghcr.io/sourceplane/stack-tectonic:${STACK_VERSION}" \
            --root . \
            --version "${STACK_VERSION}"

      - name: Confirm package is pullable
        run: |
          orun fetch "ghcr.io/sourceplane/stack-tectonic:${STACK_VERSION}" \
            --output "${RUNNER_TEMP}/published" --overwrite
          test -f "${RUNNER_TEMP}/published/stack.yaml"
          echo "published $(ls "${RUNNER_TEMP}/published/compositions" | wc -l) composition(s)"

