apiVersion: sourceplane.io/v1alpha1
kind: JobTemplate
metadata:
  name: cloudflare-worker-verify-deploy
spec:
  description: Capability-tagged atomic steps for a standalone Cloudflare Worker
  runsOn: ubuntu-22.04
  timeout: 30m
  retries: 0

  labels:
    scope: delivery

  capabilities:
    - cloudflare-worker.setup-node
    - cloudflare-worker.install
    - cloudflare-worker.verify-structure
    - cloudflare-worker.build
    - cloudflare-worker.typecheck
    - cloudflare-worker.deploy-dry-run
    - cloudflare-worker.pre-deploy
    - cloudflare-worker.migrate
    - cloudflare-worker.deploy
    - cloudflare-worker.smoke

  steps:
    - id: setup-node
      name: setup-node
      capability: cloudflare-worker.setup-node
      use: actions/setup-node@v6
      with:
        node-version: "{{ .parameters.nodeVersion }}"

    - id: install-dependencies
      name: install-dependencies
      capability: cloudflare-worker.install
      shell: bash
      working-directory: "{{ .parameters.appDir }}"
      run: "{{ .parameters.installCommand }}"
      onFailure: stop

    - id: verify-worker-structure
      name: verify-worker-structure
      capability: cloudflare-worker.verify-structure
      shell: bash
      working-directory: "{{ .parameters.appDir }}"
      run: |
        test -f package.json
        test -f "{{ .parameters.wranglerConfig }}"
      onFailure: stop

    - id: build-worker
      name: build-worker
      capability: cloudflare-worker.build
      shell: bash
      working-directory: "{{ .parameters.appDir }}"
      run: "{{ .parameters.buildCommand }}"
      onFailure: stop

    - id: typecheck-worker
      name: typecheck-worker
      capability: cloudflare-worker.typecheck
      shell: bash
      working-directory: "{{ .parameters.appDir }}"
      run: "{{ .parameters.typecheckCommand }}"
      onFailure: stop

    - id: deploy-dry-run
      name: deploy-dry-run
      capability: cloudflare-worker.deploy-dry-run
      shell: bash
      working-directory: "{{ .parameters.appDir }}"
      run: "{{ .parameters.dryRunCommand }}"
      onFailure: stop

    - id: pre-deploy
      name: pre-deploy
      capability: cloudflare-worker.pre-deploy
      shell: bash
      working-directory: "{{ .parameters.appDir }}"
      run: "{{ .parameters.preDeployCommand }}"
      onFailure: stop

    - id: migrate
      name: migrate
      capability: cloudflare-worker.migrate
      shell: bash
      working-directory: "{{ .parameters.appDir }}"
      run: "{{ .parameters.migrationCommand }}"
      onFailure: stop

    - id: deploy
      name: deploy
      capability: cloudflare-worker.deploy
      shell: bash
      working-directory: "{{ .parameters.appDir }}"
      run: |
        : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
        : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
        {{ .parameters.deployCommand }}
      onFailure: stop

    - id: smoke
      name: smoke
      capability: cloudflare-worker.smoke
      shell: bash
      working-directory: "{{ .parameters.appDir }}"
      run: |
        set -uo pipefail
        # smokeCommand runs under retry-with-backoff: a brand-new workers.dev
        # route can take MINUTES to resolve on a first deploy (measured live
        # — a console route 404'd for minutes then served 200), and a raw
        # single-shot probe parks the whole convergence (and every DAG
        # dependent) on a manual rerun. ~4.5 min budget; a real regression
        # still fails after it.
        smoke() {
          {{ .parameters.smokeCommand }}
        }
        attempts=10
        for i in $(seq 1 "$attempts"); do
          if smoke; then
            [ "$i" -gt 1 ] && echo "smoke passed on attempt $i/$attempts"
            exit 0
          fi
          if [ "$i" -lt "$attempts" ]; then
            wait=$(( i * 6 )); [ "$wait" -gt 45 ] && wait=45
            echo "smoke attempt $i/$attempts failed — retrying in ${wait}s"
            sleep "$wait"
          fi
        done
        echo "smoke failed after $attempts attempts (~4.5m budget)"
        exit 1
      onFailure: stop
