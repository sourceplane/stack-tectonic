apiVersion: sourceplane.io/v1alpha1
kind: JobTemplate
metadata:
  name: terraform-validate
spec:
  description: Run Terraform fmt, init, validate, and plan for component roots
  runsOn: ubuntu-22.04
  timeout: 20m
  retries: 0

  labels:
    scope: infra

  capabilities:
    - terraform.setup
    - terraform.env
    - terraform.context
    - terraform.fmt
    - terraform.init
    - terraform.validate
    - terraform.plan
    - terraform.apply

  steps:
    - id: setup-terraform
      name: setup-terraform
      capability: terraform.setup
      use: hashicorp/setup-terraform@v4
      with:
        terraform_version: "{{.parameters.terraformVersion}}"
        terraform_wrapper: "false"

    - id: terraform-env
      name: Export Terraform Env
      capability: terraform.env
      shell: bash
      run: |
        {
          {{- range $key, $value := .env }}
          printf '%s=%s\n' '{{ $key }}' '{{ $value }}'
          {{- end }}

          {{- range $key, $value := .parameters }}
          printf 'TF_VAR_{{ $key }}=%s\n' '{{ $value }}'
          {{- end }}

          printf 'TF_VAR_environment=%s\n' "{{ .orun.environment.name }}"
          printf 'TF_VAR_component=%s\n' "{{ .orun.component.name }}"
        } >> "$ORUN_ENV"
      onFailure: stop

    - id: terraform-context
      name: Terraform Context
      capability: terraform.context
      shell: bash
      run: |
        terraform version
        echo "Component: {{ .orun.component.name }}"
        echo "Environment: {{ .orun.environment.name }}"
        echo "Terraform directory: {{ .parameters.terraformDir }}"
      onFailure: stop

    - id: terraform-fmt-check
      name: fmt Check
      capability: terraform.fmt
      run: "terraform -chdir={{ .parameters.terraformDir }} fmt -check"
      onFailure: stop

    - id: terraform-init
      name: Init
      capability: terraform.init
      shell: bash
      # State lives on the platform (SB1): the runner exports TF_HTTP_* per job
      # (address = …/state/tfstate/{component}/{env}, run token as password), so
      # `backend "http"` needs no -backend-config and no AWS credentials step.
      # The environment is IN the address — no terraform workspaces.
      run: |
        set -euo pipefail

        terraform -chdir={{ .parameters.terraformDir }} init \
          -input=false \
          -reconfigure
      onFailure: stop

    - id: terraform-validate
      name: Validate
      capability: terraform.validate
      run: "terraform -chdir={{ .parameters.terraformDir }} validate -no-color"
      onFailure: stop

    - id: terraform-plan
      name: Plan
      capability: terraform.plan
      run: "terraform -chdir={{ .parameters.terraformDir }} plan -no-color"
      onFailure: stop

    - id: terraform-apply
      name: Apply
      capability: terraform.apply
      shell: bash
      # SEC-JOB: declared outputs are appended to the runner's secret-outputs
      # sink INSIDE the apply step — no extra sync step, no CLI, no auth. The
      # RUNNER publishes them post-success over the run's lease-bound channel;
      # the platform derives the target scope (project/env rung) from the
      # leased job itself. secretOutputs: "KEY=output,KEY2=output2".
      run: |
        set -euo pipefail
        terraform -chdir={{ .parameters.terraformDir }} apply -no-color -auto-approve
        {{- if .parameters.secretOutputs }}
        for pair in $(echo "{{ .parameters.secretOutputs }}" | tr ',' ' '); do
          key="${pair%%=*}"
          output="${pair#*=}"
          {
            printf '%s<<__ORUN_EOF__\n' "$key"
            terraform -chdir={{ .parameters.terraformDir }} output -raw "$output"
            printf '\n__ORUN_EOF__\n'
          } >> "${ORUN_SECRET_OUTPUTS:?runner did not provide the secret-outputs sink}"
          echo "queued secret output $key ← output/$output"
        done
        {{- end }}
      onFailure: stop
