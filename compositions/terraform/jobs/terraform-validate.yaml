apiVersion: sourceplane.io/v1alpha1
kind: JobTemplate
metadata:
  name: terraform-validate
spec:
  description: Run Terraform fmt, init, validate, and plan for component roots
  runsOn: ubuntu-22.04
  timeout: 20m
  retries: 0

  labels:
    scope: infra

  capabilities:
    - terraform.setup
    - terraform.env
    - terraform.context
    - terraform.fmt
    - terraform.init
    - terraform.validate
    - terraform.plan
    - terraform.apply
    - terraform.wire-secrets

  steps:
    - id: setup-terraform
      name: setup-terraform
      capability: terraform.setup
      use: hashicorp/setup-terraform@v4
      with:
        terraform_version: "{{.parameters.terraformVersion}}"
        terraform_wrapper: "false"

    - id: terraform-env
      name: Export Terraform Env
      capability: terraform.env
      shell: bash
      run: |
        {
          {{- range $key, $value := .env }}
          printf '%s=%s\n' '{{ $key }}' '{{ $value }}'
          {{- end }}

          {{- range $key, $value := .parameters }}
          printf 'TF_VAR_{{ $key }}=%s\n' '{{ $value }}'
          {{- end }}

          printf 'TF_VAR_environment=%s\n' "{{ .orun.environment.name }}"
          printf 'TF_VAR_component=%s\n' "{{ .orun.component.name }}"
        } >> "$ORUN_ENV"
      onFailure: stop

    - id: terraform-context
      name: Terraform Context
      capability: terraform.context
      shell: bash
      run: |
        terraform version
        echo "Component: {{ .orun.component.name }}"
        echo "Environment: {{ .orun.environment.name }}"
        echo "Terraform directory: {{ .parameters.terraformDir }}"
      onFailure: stop

    - id: terraform-fmt-check
      name: fmt Check
      capability: terraform.fmt
      run: "terraform -chdir={{ .parameters.terraformDir }} fmt -check"
      onFailure: stop

    - id: terraform-init
      name: Init
      capability: terraform.init
      shell: bash
      # State lives on the platform (SB1): the runner exports TF_HTTP_* per job
      # (address = …/state/tfstate/{component}/{env}, run token as password), so
      # `backend "http"` needs no -backend-config and no AWS credentials step.
      # The environment is IN the address — no terraform workspaces.
      run: |
        set -euo pipefail

        terraform -chdir={{ .parameters.terraformDir }} init \
          -input=false \
          -reconfigure
      onFailure: stop

    - id: terraform-validate
      name: Validate
      capability: terraform.validate
      run: "terraform -chdir={{ .parameters.terraformDir }} validate -no-color"
      onFailure: stop

    - id: terraform-plan
      name: Plan
      capability: terraform.plan
      run: "terraform -chdir={{ .parameters.terraformDir }} plan -no-color"
      onFailure: stop

    - id: terraform-apply
      name: Apply
      capability: terraform.apply
      run: "terraform -chdir={{ .parameters.terraformDir }} apply -no-color -auto-approve"
      onFailure: stop

    - id: wire-secrets
      name: Wire outputs to orun secrets
      capability: terraform.wire-secrets
      shell: bash
      # Post-apply secret WRITES go through orun (no Secrets Manager): each
      # KEY=output pair in wireSecrets pushes `terraform output -raw <output>`
      # into the project/{{env}} secret rung via `orun secrets set` (value over
      # stdin — never echoed, never in argv). Downstream consumers read the
      # same keys back as secretEnv references. The (org, project) scope is
      # parsed from the runner-exported TF_HTTP_ADDRESS, so this step needs no
      # extra parameters and works in any workspace the run targets.
      run: |
        {{- if .parameters.wireSecrets }}
        set -euo pipefail
        # Scope from the runner-exported backend address (org_…/prj_… public
        # ids) — no repo link exists in CI, so the CLI reads these env vars.
        export ORUN_WORKSPACE=$(printf '%s' "$TF_HTTP_ADDRESS" | sed -E 's#.*/organizations/([^/]+)/projects/.*#\1#')
        export ORUN_PROJECT=$(printf '%s' "$TF_HTTP_ADDRESS" | sed -E 's#.*/projects/([^/]+)/state/.*#\1#')
        tmp=$(mktemp)
        trap 'rm -f "$tmp"' EXIT
        for pair in $(echo "{{ .parameters.wireSecrets }}" | tr ',' ' '); do
          key="${pair%%=*}"
          output="${pair#*=}"
          terraform -chdir={{ .parameters.terraformDir }} output -raw "$output" > "$tmp"
          # First deploy creates; later deploys append a version (set 409s on
          # an existing key). Value travels via file+stdin — never argv/echo.
          orun secrets set "$key" --env "{{ .orun.environment.name }}" < "$tmp" \
            || orun secrets rotate "$key" --env "{{ .orun.environment.name }}" < "$tmp"
          echo "wired $key ← output/$output"
        done
        {{- else }}
        echo "wire-secrets: no wireSecrets declared; skipping."
        {{- end }}
      onFailure: stop
