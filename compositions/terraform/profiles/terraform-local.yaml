apiVersion: sourceplane.io/v1alpha1
kind: ExecutionProfile
metadata:
  name: terraform-local
spec:
  # Local lane: omits terraform.apply (and wire-secrets), so it plans against
  # the platform state backend and never mutates infrastructure.
  description: Local Terraform plan only — no apply

  jobs:
    terraform:
      includeCapabilities:
        - terraform.setup
        - terraform.env
        - terraform.context
        - terraform.fmt
        - terraform.init
        - terraform.validate
        - terraform.plan
