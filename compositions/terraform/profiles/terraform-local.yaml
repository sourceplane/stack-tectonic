apiVersion: sourceplane.io/v1alpha1
kind: ExecutionProfile
metadata:
  name: terraform-local
spec:
  # Credential-free local lane: omits terraform.aws-credentials and
  # terraform.apply, so it plans without assuming a role and never mutates
  # infrastructure. The description previously read "Full Terraform plan and
  # apply for live environments", copy-pasted from the apply profile.
  description: Local Terraform plan only — no AWS credentials, no apply

  jobs:
    terraform:
      includeCapabilities:
        - terraform.setup
        - terraform.env
        - terraform.context
        - terraform.fmt
        - terraform.init
        - terraform.workspace
        - terraform.validate
        - terraform.plan
