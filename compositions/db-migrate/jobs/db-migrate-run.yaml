apiVersion: sourceplane.io/v1alpha1
kind: JobTemplate
metadata:
  name: db-migrate-run
spec:
  description: Run database migrations in plan or apply mode
  runsOn: ubuntu-22.04
  timeout: 10m
  retries: 0

  labels:
    scope: database

  capabilities:
    - db-migrate.setup-node
    - db-migrate.setup-pnpm
    - db-migrate.install
    - db-migrate.build
    - db-migrate.plan
    - db-migrate.apply

  steps:
    # setup-pnpm runs before setup-node so setup-node can warm and persist the
    # pnpm store cache (keyed on the workspace lockfile).
    - id: setup-pnpm
      name: setup-pnpm
      capability: db-migrate.setup-pnpm
      use: pnpm/action-setup@v4
      with:
        version: "{{.parameters.pnpmVersion}}"

    - id: setup-node
      name: setup-node
      capability: db-migrate.setup-node
      use: actions/setup-node@v6
      with:
        node-version: "{{.parameters.nodeVersion}}"
        cache: pnpm
        cache-dependency-path: "**/pnpm-lock.yaml"

    - id: install-dependencies
      name: install-dependencies
      capability: db-migrate.install
      run: pnpm install --frozen-lockfile
      onFailure: stop

    - id: build-db-package
      name: build-db-package
      capability: db-migrate.build
      # buildFilter names the package whose dist/runner/cli.js the plan and
      # apply steps run. Absent, this renders exactly as 0.21.0 did. orun does
      # not copy the schema's default into .parameters, so the else branch is
      # what supplies @saas/db.
      #
      # The guard and the value must read the same key, .parameters.buildFilter.
      # A guard on any other key is always false: the step builds @saas/db, goes
      # green, and the mismatch only shows two steps later as MODULE_NOT_FOUND.
      # verify.sh renders this step with and without the parameter.
      run: pnpm exec turbo run build --filter={{if .parameters.buildFilter}}{{.parameters.buildFilter}}{{else}}@saas/db{{end}}
      onFailure: stop

    - id: migrate-plan
      name: Migration Plan
      capability: db-migrate.plan
      shell: bash
      run: |
        set -euo pipefail
        MIGRATION_ENV="{{ .orun.environment.name }}" node ../../dist/runner/cli.js plan --env "{{ .orun.environment.name }}"
      onFailure: stop

    - id: migrate-apply
      name: Migration Apply
      capability: db-migrate.apply
      shell: bash
      run: |
        set -euo pipefail
        MIGRATION_ENV="{{ .orun.environment.name }}" node ../../dist/runner/cli.js apply --env "{{ .orun.environment.name }}"
      onFailure: stop
