apiVersion: sourceplane.io/v1alpha1
kind: ComponentSchema
metadata:
  name: db-migrate-component
spec:
  type: db-migrate
  schema:
    $schema: http://json-schema.org/draft-07/schema#
    title: Database Migration Component
    type: object
    required:
      - name
      - type
      - parameters
    properties:
      name:
        type: string
      type:
        type: string
        const: db-migrate
      parameters:
        type: object
        required:
          - nodeVersion
          - pnpmVersion
        properties:
          nodeVersion:
            type: string
          pnpmVersion:
            type: string
          buildFilter:
            type: string
            minLength: 1
            default: "@saas/db"
            description: >-
              Turbo filter for the package whose dist/runner/cli.js runs the
              migrations. The job reaches it as ../../dist/runner/cli.js, so it
              must be the package that holds this component's migrations
              directory. Defaults to @saas/db.
          owner:
            type: string
          repo:
            type: string
        additionalProperties: false
    additionalProperties: true
