apiVersion: sourceplane.io/v1alpha1
kind: ExecutionProfile
metadata:
  name: cloudflare-worker-turbo-deploy
spec:
  description: Build, validate, migrate, deploy, and smoke test a Cloudflare Worker

  policies:
    requireApproval: true
    requireCleanGitTree: true

  # The deploy step talks to the Cloudflare API (wrangler deploy), so the
  # profile declares the credential it needs as an orun secret binding: the
  # planner maps it to secret://<workspace>/<project>/<env>/CLOUDFLARE_API_TOKEN
  # and the runner resolves + injects it at run time (redacted from logs).
  # Verify/pull-request profiles deliberately carry no bindings — those lanes
  # never touch the Cloudflare API and never resolve a credential.
  secretBindings:
    CLOUDFLARE_API_TOKEN: { required: true }
    # The account id is a non-secret connection fact, brokered from the same
    # Cloudflare integration (template: account-id) — bound here so the deploy
    # step needs no ambient CI value for it either.
    CLOUDFLARE_ACCOUNT_ID: { required: true }

  jobs:
    verify-deploy:
      includeCapabilities:
        - cloudflare-worker-turbo.setup-node
        - cloudflare-worker-turbo.setup-pnpm
        - cloudflare-worker-turbo.install
        - cloudflare-worker-turbo.verify-structure
        # BF6: templated workers have no committed wrangler.jsonc — render from
        # the fixture so build/typecheck have a config; wire-live re-renders
        # with real IDs before deploy (no-op for non-templated workers).
        - cloudflare-worker-turbo.wire-fixture
        - cloudflare-worker-turbo.build
        - cloudflare-worker-turbo.typecheck
        # BF6: resolve binding IDs from the Secrets Manager wiring manifest at
        # deploy time (no-op for workers without a wrangler template).
        - cloudflare-worker-turbo.wire-live
        - cloudflare-worker-turbo.pre-deploy
        - cloudflare-worker-turbo.migrate
        - cloudflare-worker-turbo.deploy
        # SS2: hydrate runtime secrets from the worker-secrets escrow after
        # deploy (first boot creates the worker first); no-op for components
        # without runtimeSecrets, clean skip until keys are seeded in orun.
        - cloudflare-worker-turbo.secrets-live
        - cloudflare-worker-turbo.smoke
