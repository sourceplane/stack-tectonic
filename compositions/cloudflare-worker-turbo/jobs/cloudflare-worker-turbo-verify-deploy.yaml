apiVersion: sourceplane.io/v1alpha1
kind: JobTemplate
metadata:
  name: cloudflare-worker-turbo-verify-deploy
spec:
  description: Capability-tagged atomic steps for Cloudflare Worker with Turborepo
  runsOn: ubuntu-22.04
  timeout: 30m
  retries: 0

  labels:
    scope: delivery

  capabilities:
    - cloudflare-worker-turbo.setup-node
    - cloudflare-worker-turbo.setup-pnpm
    - cloudflare-worker-turbo.install
    - cloudflare-worker-turbo.verify-structure
    - cloudflare-worker-turbo.wire-fixture
    - cloudflare-worker-turbo.build
    - cloudflare-worker-turbo.typecheck
    - cloudflare-worker-turbo.deploy-dry-run
    - cloudflare-worker-turbo.wire-live
    - cloudflare-worker-turbo.pre-deploy
    - cloudflare-worker-turbo.migrate
    - cloudflare-worker-turbo.deploy
    - cloudflare-worker-turbo.secrets-live
    - cloudflare-worker-turbo.smoke

  steps:
    - id: setup-node
      name: setup-node
      capability: cloudflare-worker-turbo.setup-node
      use: actions/setup-node@v6
      with:
        node-version: "{{ .parameters.nodeVersion }}"

    - id: setup-pnpm
      name: setup-pnpm
      capability: cloudflare-worker-turbo.setup-pnpm
      use: pnpm/action-setup@v4
      with:
        version: "{{ .parameters.pnpmVersion }}"

    - id: install-workspace-dependencies
      name: install-workspace-dependencies
      capability: cloudflare-worker-turbo.install
      shell: bash
      run: "{{ .parameters.installCommand }}"
      onFailure: stop

    - id: verify-worker-structure
      name: verify-worker-structure
      capability: cloudflare-worker-turbo.verify-structure
      shell: bash
      run: |
        test -f package.json
        {{- if .parameters.wranglerTemplate }}
        # BF6: templated worker — the committed artifact is the template; the
        # deployable config is rendered by wire-fixture/wire-live. Guard: a
        # template must never carry committed 32-hex resource IDs.
        test -f "{{ .parameters.wranglerTemplate }}"
        if grep -nE '"id":[[:space:]]*"[0-9a-f]{32}"' "{{ .parameters.wranglerTemplate }}"; then
          echo "verify-worker-structure: committed resource IDs found in {{ .parameters.wranglerTemplate }} — use @@wiring(...)@@ tokens" >&2
          exit 1
        fi
        {{- else }}
        test -f "{{ .parameters.wranglerConfig }}"
        {{- end }}
      onFailure: stop

    - id: wire-fixture
      name: wire-fixture
      capability: cloudflare-worker-turbo.wire-fixture
      shell: bash
      run: |
        {{- if .parameters.wranglerTemplate }}
        node {{ .parameters.workspaceDir }}/tooling/wire/render.mjs \
          --template "{{ .parameters.wranglerTemplate }}" \
          --out "{{ .parameters.wranglerConfig }}" \
          --map "{{ .parameters.wiringFixture }}"
        {{- else }}
        echo "wire-fixture: component is not wiring-templated; skipping."
        {{- end }}
      onFailure: stop

    - id: build-worker
      name: build-worker
      capability: cloudflare-worker-turbo.build
      shell: bash
      run: "{{ .parameters.buildCommand }}"
      onFailure: stop

    - id: typecheck-worker
      name: typecheck-worker
      capability: cloudflare-worker-turbo.typecheck
      shell: bash
      run: "{{ .parameters.typecheckCommand }}"
      onFailure: stop

    - id: deploy-dry-run
      name: deploy-dry-run
      capability: cloudflare-worker-turbo.deploy-dry-run
      shell: bash
      run: "pnpm exec wrangler deploy --dry-run --config {{ .parameters.wranglerConfig }} --env {{ .orun.environment.name }}"
      onFailure: stop

    - id: wire-live
      name: wire-live
      capability: cloudflare-worker-turbo.wire-live
      shell: bash
      run: |
        {{- if .parameters.wranglerTemplate }}
        set -euo pipefail
        # Wiring documents come from orun secrets (de-AWS): each infra component
        # pushed its outputs as WIRING_<COMPONENT> on the project/<env> rung
        # (terraform wire-secrets step), and THIS component declares them in
        # secretEnv as WIRING_<COMPONENT>_<ENV> — the runner resolves them into
        # the step env, so the render input is plain env-var indirection.
        wiring_dir=$(mktemp -d)
        for comp in $(echo "{{ .parameters.wiringComponents }}" | tr ',' ' '); do
          for wenv in $(echo "{{ .parameters.wiringEnvs }}" | tr ',' ' '); do
            var="WIRING_$(echo "${comp}" | tr 'a-z-' 'A-Z_')_$(echo "${wenv}" | tr 'a-z' 'A-Z')"
            if [ -z "${!var:-}" ]; then
              echo "wire-live: ${var} is empty — declare it in this component's secretEnv (secret://<ws>/<project>/${wenv}/WIRING_$(echo "${comp}" | tr 'a-z-' 'A-Z_'))" >&2
              exit 1
            fi
            printf '%s' "${!var}" > "${wiring_dir}/${comp}__${wenv}.json"
          done
        done
        node {{ .parameters.workspaceDir }}/tooling/wire/render.mjs \
          --template "{{ .parameters.wranglerTemplate }}" \
          --out "{{ .parameters.wranglerConfig }}" \
          --secrets-dir "${wiring_dir}"
        {{- else }}
        echo "wire-live: component is not wiring-templated; skipping."
        {{- end }}
      onFailure: stop

    - id: pre-deploy
      name: pre-deploy
      capability: cloudflare-worker-turbo.pre-deploy
      shell: bash
      run: "{{ .parameters.preDeployCommand }}"
      onFailure: stop

    - id: migrate
      name: migrate
      capability: cloudflare-worker-turbo.migrate
      shell: bash
      run: "{{ .parameters.migrationCommand }}"
      onFailure: stop

    - id: deploy
      name: deploy
      capability: cloudflare-worker-turbo.deploy
      shell: bash
      run: |
        : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
        : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
        pnpm exec wrangler deploy --config {{ .parameters.wranglerConfig }} --env {{ .orun.environment.name }}
      onFailure: stop

    - id: secrets-live
      name: secrets-live
      capability: cloudflare-worker-turbo.secrets-live
      shell: bash
      run: |
        {{- if .parameters.runtimeSecrets }}
        # Runtime worker secrets from orun (wire-now-seed-later): the component
        # declares its runtime keys in optionalSecretEnv — resolved best-effort
        # into THIS job's env by the runner — and names them in the
        # runtimeSecrets parameter. Every name with a value present is pushed
        # via `wrangler secret bulk` after deploy (first boot creates the
        # worker before secrets are pushed; bulk rolls a new version
        # immediately, so smoke observes the synced state). Unseeded names are
        # skipped and reported by NAME only — values never reach the log, and
        # the runner's redactor additionally scrubs any resolved value from
        # captured output.
        set -euo pipefail
        env_name="{{ .orun.environment.name }}"
        bulk="$(mktemp)"
        present=(); missing=()
        IFS=',' read -ra names <<< "{{ .parameters.runtimeSecrets }}"
        for name in "${names[@]}"; do
          name="$(echo "$name" | xargs)"
          [ -z "$name" ] && continue
          if [ -n "${!name:-}" ]; then present+=("$name"); else missing+=("$name"); fi
        done
        if [ "${#present[@]}" -eq 0 ]; then
          echo "secrets-live: none of the declared runtime secrets are seeded in orun yet — leaving existing worker secrets untouched."
          rm -f "$bulk"; exit 0
        fi
        for name in "${present[@]}"; do
          printf '%s' "${!name}" | jq -Rs --arg k "$name" '{($k): .}'
        done | jq -s 'add' > "$bulk"
        pnpm exec wrangler secret bulk "$bulk" --config {{ .parameters.wranglerConfig }} --env "${env_name}"
        rm -f "$bulk"
        echo "secrets-live: pushed ${#present[@]} runtime secret(s): ${present[*]}"
        if [ "${#missing[@]}" -gt 0 ]; then
          echo "secrets-live: not seeded yet (skipped): ${missing[*]}"
        fi
        {{- else }}
        echo "secrets-live: component declares no runtime secrets; skipping."
        {{- end }}
      onFailure: stop

    - id: smoke
      name: smoke
      capability: cloudflare-worker-turbo.smoke
      shell: bash
      # The product's smokeCommand runs under retry-with-backoff: a
      # brand-new workers.dev route can 4xx for a few seconds after
      # `wrangler deploy` returns while the subdomain propagates, and a
      # first-boot worker may cold-start slower than a raw curl --fail
      # tolerates. A real regression still fails after the ~75s budget; a
      # propagation race passes on an early retry instead of parking the
      # whole convergence on a manual rerun.
      run: |
        set -uo pipefail
        smoke() {
          {{ .parameters.smokeCommand }}
        }
        attempts=10
        for i in $(seq 1 "$attempts"); do
          if smoke; then
            [ "$i" -gt 1 ] && echo "smoke passed on attempt $i/$attempts"
            exit 0
          fi
          if [ "$i" -lt "$attempts" ]; then
            wait=$(( i * 6 )); [ "$wait" -gt 45 ] && wait=45
            echo "smoke attempt $i/$attempts failed — retrying in ${wait}s"
            sleep "$wait"
          fi
        done
        echo "smoke failed after $attempts attempts (~4.5m budget)"
        exit 1
      onFailure: stop
